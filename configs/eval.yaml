# Shared eval settings. Hard rule 7: identical for every setup; only the
# model, adapter or agent changes between setups.

# Sampling (task 1.2, 2026-10-17). One value for every setup. 0.6/0.95 is the student card's
# tool-calling setting. Lightning's card says 1.0/0.95, but the ladder measures the student and
# Lightning is only the reference row. Factory rollouts (task 2.1) aren't an eval setup and can use
# Lightning's 1.0. No seed: the 3 attempts per case should be independent samples. Sent explicitly
# on every request, because the student's generation_config.json would otherwise give vLLM 1.0.
temperature: 0.6
top_p: 0.95
max_tokens: 8192            # per model call; caps a runaway reasoning trace
# Thinking off for every setup (task 1.2, 2026-10-17). With thinking on, the student already passed
# 10-11/12 practice cases per API, leaving the ladder no room; with it off it passed 5-9/12, using about
# a third of the completion tokens and half the latency (runs/think_*, COMMANDS_LOG.md). The factory's
# Lightning rollouts aren't an eval setup and can keep thinking on.
thinking: false             # enable_thinking for every model call, every setup (the self-check is always off)
max_steps: 10               # max model turns per step (seatbelt self-check calls don't count)
attempts_per_case: 3
pass_min_attempts: 2        # a case passes if at least 2 of 3 attempts pass

seatbelt:
  max_retries_per_step: 2   # invalid calls, environment errors and failed self-checks
  transient_retries: 3      # automatic 503 retries with backoff, without the model
  transient_backoff_s: 0.5  # first retry delay; doubles on each retry

chaos: false                # only true in the demo or in runs flagged --chaos

# Price per 1M tokens (task 0.2, 2026-10-17). The same formula for every model:
#   price_per_1m = gpu_usd_per_hour / (measured_tokens_per_second * 3600 / 1e6)
# The whole GPU's price is charged to whichever model is running, as if it had the H200 alone
# (the other server was idle during each benchmark). Adapters are priced as the student.
#
# Throughput: `vllm bench serve` with the serve scripts' flags, random token prompts, 256 requests at
# concurrency 64, seed 0, --ignore-eos. Results in runs/prices/<model>_{prefill,decode}.json.
#   prompt:     input 2048, output 1    -> total_input_tokens / duration
#   completion: input 128,  output 512  -> output_throughput
gpu_usd_per_hour: 6.53  # Brev, 1x H200
throughput_tokens_per_s:
  lightning: {prompt: 56609, completion: 3949}
  student: {prompt: 77991, completion: 9430}
prices_usd_per_1m_tokens:
  lightning: {prompt: 0.0320, completion: 0.4594}
  student: {prompt: 0.0233, completion: 0.1924}
