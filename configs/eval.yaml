# Shared eval settings. Hard rule 7: identical for every setup; only the
# model, adapter or agent changes between setups.

temperature: null           # set before the first baseline (task 1.2)
max_steps: null             # max model turns per step; set in task 1.2
attempts_per_case: 3
pass_min_attempts: 2        # a case passes if at least 2 of 3 attempts pass

seatbelt:
  max_retries_per_step: 2   # invalid calls and environment errors
  transient_retries: 3      # automatic 503 retries with backoff, without the model

chaos: false                # only true in the demo or in runs flagged --chaos

# Price per 1M tokens (task 0.2, 2026-10-17). The same formula for every model:
#   price_per_1m = gpu_usd_per_hour / (measured_tokens_per_second * 3600 / 1e6)
# The whole GPU's price is charged to whichever model is running, as if it had the H200 alone
# (the other server was idle during each benchmark). Adapters are priced as the student.
#
# Throughput: `vllm bench serve` with the serve scripts' flags, random token prompts, 256 requests at
# concurrency 64, seed 0, --ignore-eos. Results in runs/prices/<model>_{prefill,decode}.json.
#   prompt:     input 2048, output 1    -> total_input_tokens / duration
#   completion: input 128,  output 512  -> output_throughput
gpu_usd_per_hour: 6.53  # Brev, 1x H200
throughput_tokens_per_s:
  lightning: {prompt: 56609, completion: 3949}
  student: {prompt: 77991, completion: 9430}
prices_usd_per_1m_tokens:
  lightning: {prompt: 0.0320, completion: 0.4594}
  student: {prompt: 0.0233, completion: 0.1924}
