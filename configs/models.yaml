# Every generative model the system uses. Hard rule 2: each one is <=33B total
# parameters (per model, confirmed by the organizers). Values confirmed against
# each official model card in task 0.2 (2026-10-17).

# Pinned by Lightning's model card (vllm/vllm-openai:v0.27.1); on PyPI 2026-08-11,
# before the rule 1 cutoff of 2026-10-03. Installed in its own venv, .venv-vllm/.
vllm_version: "0.27.1"

models:
  lightning:
    hf_id: nvidia/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-BF16
    revision: a9904d24bcc1d289a1950fa9d2b978c47cf903b9
    total_params_b: 30        # model card: "30B Total / 3B Active"
    license: OpenMDW-1.1
    port: 8000
    tool_call_parser: qwen3_coder
    reasoning_parser: nemotron_v3

  student:
    hf_id: nvidia/NVIDIA-Nemotron-3-Nano-4B-BF16
    revision: dfaf35de3e30f1867dd8dbc38a7fc9fb52d3914f
    total_params_b: 3.97      # model card: "3.97 x 10^9"
    license: NVIDIA Nemotron Open Model License
    port: 8001
    tool_call_parser: qwen3_coder
    reasoning_parser: nemotron_v3   # built-in; the card's nano_v3 plugin is the fallback

# LoRA adapters on the student (r=16, 17.1M parameters each; base plus adapter 3.99B, within rule 2). A record only:
# scripts/serve_student.sh serves every folder in adapters/ under the folder's name. Trained in task 2.2
# (factory/train_lora.py; run in runs/train_<name>/).
adapters:
  helpdesk_r1: adapters/helpdesk_r1
  ops_r1: adapters/ops_r1
  # single_trained's adapter (task 3.2, factory/train_lora.py --api all): both APIs' round 1 examples, rendered with
  # every tool, the same settings
  all_r1: adapters/all_r1
