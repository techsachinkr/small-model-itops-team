# Shared NeMo Gym config for the team setups (task 3.1), the counterpart of gym_configs/eval.yaml for the
# single-model setups. A team setup's file (gym_configs/team_*.yaml) sets only the specialists' models. The agent
# (responses_api_agents/itops_team, code in common/gym_agent.py) reads sampling, max steps and seatbelt limits from
# configs/eval.yaml like every setup (hard rule 7), and the active specialists from agents/registry.json.
# The planner and each specialist get their own model server: Gym's vllm_model server always sends its configured
# model name, and each specialist may run a different adapter on the student server. eval/run_eval.py loads:
#   gym env start --config resources_servers/itops/configs/itops.yaml \
#     --config gym_configs/eval_team.yaml --config gym_configs/<setup>.yaml
planner_model_name: lightning
planner_base_url: http://localhost:8000/v1
specialist_base_url: http://localhost:8001/v1
team_api_key: EMPTY
helpdesk_model_name: ???  # set by the setup's file
ops_model_name: ???
itops_team:
  responses_api_agents:
    itops_team:
      entrypoint: app.py
      resources_server:
        type: resources_servers
        name: itops
      planner_server:
        type: responses_api_models
        name: planner_model
      planner_model_name: ${planner_model_name}
      helpdesk_server:
        type: responses_api_models
        name: helpdesk_model
      helpdesk_model_name: ${helpdesk_model_name}
      ops_server:
        type: responses_api_models
        name: ops_model
      ops_model_name: ${ops_model_name}
planner_model:
  responses_api_models:
    vllm_model:
      entrypoint: app.py
      base_url: ${planner_base_url}
      api_key: ${team_api_key}
      model: ${planner_model_name}
      return_token_id_information: false
      uses_reasoning_parser: true
helpdesk_model:
  responses_api_models:
    vllm_model:
      entrypoint: app.py
      base_url: ${specialist_base_url}
      api_key: ${team_api_key}
      model: ${helpdesk_model_name}
      return_token_id_information: false
      uses_reasoning_parser: true
ops_model:
  responses_api_models:
    vllm_model:
      entrypoint: app.py
      base_url: ${specialist_base_url}
      api_key: ${team_api_key}
      model: ${ops_model_name}
      return_token_id_information: false
      uses_reasoning_parser: true
# resources_servers/itops/configs/itops.yaml also defines a simple agent for smoke runs. Its model server is
# policy_model, which only gym_configs/eval.yaml defines, and Gym checks every server reference at startup, so here
# it points at the planner's. Nothing sends it rollouts: eval/run_eval.py collects with --agent itops_team.
itops_simple_agent:
  responses_api_agents:
    simple_agent:
      model_server:
        type: responses_api_models
        name: planner_model
