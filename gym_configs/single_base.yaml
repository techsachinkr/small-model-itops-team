# single_base: the student base model with every tool and no orchestrator, with the seatbelt (CLAUDE.md "Eval
# setups"). The same file as base_seatbelt: eval/run_eval.py runs the single_* setups on the multi-API cases, and
# their rows carry every API's tools. Only the model and the seatbelt switch differ between setups; everything else
# is in eval.yaml.
policy_model_name: student
policy_base_url: http://localhost:8001/v1
itops_agent:
  responses_api_agents:
    itops_agent:
      seatbelt: true
